image: node:24.11.1

stages:
  - validate
  - build

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

before_script:
  - corepack enable
  - pnpm install --frozen-lockfile --store-dir .pnpm-store

lint:
  stage: validate
  script:
    - pnpm run lint
    - pnpm run format:check

typecheck:
  stage: validate
  script:
    - pnpm run typecheck

test:
  stage: validate
  script:
    - pnpm run test

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    expire_in: 1 week
    paths:
      - apps/api/dist/
      - apps/web-org/.next/
      - apps/web-admin/.next/
