image: node:24.11.1

stages:
  - validate
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: validate
  script:
    - npm run lint
    - npm run format:check

typecheck:
  stage: validate
  script:
    - npm run typecheck

test:
  stage: validate
  script:
    - npm run test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - apps/api/dist/
      - apps/web-org/.next/
      - apps/web-admin/.next/
