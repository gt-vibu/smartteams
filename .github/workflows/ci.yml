name: CI

# Every push and every pull request. Before this the only automated check on a change was a
# pre-commit hook running on the author's own machine, which can be skipped with --no-verify.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo prunes to what a change actually affects (NFR-23), so this stays proportional to
  # the diff rather than to the size of the monorepo.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint, available tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma's client is generated, not committed to the build — the typecheck needs it first.
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - name: Check formatting of changed files
        run: |
          git diff --name-only -z HEAD^1 HEAD -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.yaml' '*.yml' '*.md' '*.css' '*.scss' '*.html' '*.cjs' \
            | grep -z -v -F 'apps/api/src/modules/reports/reports.service.ts' \
            | xargs -0 -r pnpm exec prettier --check

  migrations:
    name: Migration deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://smarteam:smarteam@localhost:5432/smarteam
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smarteam
          POSTGRES_PASSWORD: smarteam
          POSTGRES_DB: smarteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarteam -d smarteam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical only. Failing on every low-severity transitive advisory trains people
      # to ignore the job, which is worse than not having it.
      - run: pnpm audit --audit-level high

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Scopes the scan to the shipped surface; see the file for what is excluded and why.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # Secrets, in the working tree and in history. A committed credential is not caught by any of
  # the jobs above, and this repository has already had one: the superadmin password was quoted
  # in a security document and reached a commit.
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history, not just the tip. A secret removed in the latest commit is still a
          # secret if it is reachable from an earlier one.
          fetch-depth: 0
      # The gitleaks release binary, pinned and checked against the release's own checksums —
      # no container image involved.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan for committed secrets
        run: gitleaks detect --source . --redact --verbose --no-banner

  # Backup and restore, exercised rather than assumed.
  #
  # docs/chore/TECHSTACK.v1.md requires recoverable payroll data. A backup nobody has restored is
  # a hypothesis, so this takes a real dump of a migrated database and restores it into a separate
  # one, asserting that the migration ledger, row-level security and the data all survive. The
  # WAL/PITR half of the requirement is server configuration and lives in
  # docs/operations/backup-and-recovery.md; what can be verified in CI is verified here.
  backup-restore:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://smarteam:smarteam@localhost:5432/smarteam
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smarteam
          POSTGRES_PASSWORD: smarteam
          POSTGRES_DB: smarteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarteam -d smarteam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Dump, restore, and compare the migration ledger
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" createdb -U smarteam smarteam_restore
          docker exec "$POSTGRES_CONTAINER" pg_dump -U smarteam --format=custom smarteam > "$RUNNER_TEMP/smarteam.dump"
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U smarteam --exit-on-error --no-owner --no-privileges --dbname=smarteam_restore < "$RUNNER_TEMP/smarteam.dump"
          source_count=$(docker exec "$POSTGRES_CONTAINER" psql -U smarteam -d smarteam -Atc 'SELECT count(*) FROM "_prisma_migrations"')
          restored_count=$(docker exec "$POSTGRES_CONTAINER" psql -U smarteam -d smarteam_restore -Atc 'SELECT count(*) FROM "_prisma_migrations"')
          test "$source_count" -gt 0
          test "$source_count" = "$restored_count"
