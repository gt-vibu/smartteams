name: CI

# Every push and every pull request. Before this the only automated check on a change was a
# pre-commit hook running on the author's own machine, which can be skipped with --no-verify.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo prunes to what a change actually affects (NFR-23), so this stays proportional to
  # the diff rather than to the size of the monorepo.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma's client is generated, not committed to the build — the typecheck needs it first.
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: pnpm format:check

  migrations:
    name: Migrations and database-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smarteam
          POSTGRES_PASSWORD: smarteam
          POSTGRES_DB: smarteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarteam -d smarteam"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://smarteam:smarteam@localhost:5432/smarteam
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Proves the committed migrations apply to an empty database in order. A migration that
      # only ever ran against the author's already-populated database fails here.
      - run: pnpm db:deploy

      # The tests that need a real database: row-level security, the cross-tenant policies and
      # the structural invariants. The rest of the suite mocks Prisma and cannot see any of it.
      #
      # There is deliberately no `migrate diff` drift gate. The initial migration was written by
      # hand rather than generated, so it differs from the datamodel in index names and in whether
      # ids default in the database or in Prisma — cosmetic, pre-existing, and it would leave the
      # gate permanently red while catching nothing. The integration suite asserts the structural
      # properties that actually matter instead.
      - run: pnpm --filter @smarteam/api test:integration
        env:
          # The suite creates its own restricted role, so it needs a role that can. The runtime
          # role must NOT be this one — that is the whole point of the RLS guard.
          DATABASE_URL: postgresql://smarteam:smarteam@localhost:5432/smarteam

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical only. Failing on every low-severity transitive advisory trains people
      # to ignore the job, which is worse than not having it.
      - run: pnpm audit --audit-level high

  end-to-end:
    name: API end-to-end suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smarteam
          POSTGRES_PASSWORD: smarteam
          POSTGRES_DB: smarteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarteam -d smarteam"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # MinIO exists ONLY here, as CI's S3-compatible test double.
      #
      # Development and production both use real AWS S3 through the same StorageService; nothing
      # in the application, docker-compose.yml or .env.example knows this container exists. It is
      # here because the alternative to a test double is either long-lived AWS keys in GitHub or
      # an ungated storage suite, and 45 real storage checks are worth more than either.
      #
      # Started with `docker run` rather than as a service container because it needs a command
      # and a KMS master key. The key is what makes SSE-S3 work: the API signs every upload with
      # ServerSideEncryption AES256, which real S3 accepts and MinIO answers 501 to without one.
      - name: Start MinIO with SSE-S3 (CI-only S3 test double)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=smarteam \
            -e MINIO_ROOT_PASSWORD=smarteam-ci-only \
            -e MINIO_KMS_SECRET_KEY="ci-key:$(openssl rand -base64 32)" \
            minio/minio:latest server /data
          for i in $(seq 1 40); do
            curl -fsS http://localhost:9000/minio/health/live && break || sleep 2
          done
          # `minio/mc` sets its entrypoint to `mc`, so a shell has to be asked for explicitly.
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 smarteam smarteam-ci-only &&
            mc mb --ignore-existing local/smarteam-files &&
            mc anonymous set none local/smarteam-files"

      # The verify scripts read .env from the repository root, the same file a developer uses.
      # Written here rather than committed so CI has no credential of its own to leak.
      - name: Write the environment the suites expect
        run: |
          cat > .env <<'ENV'
          NODE_ENV=development
          DATABASE_URL=postgresql://smarteam:smarteam@localhost:5432/smarteam
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=ci-only-jwt-secret-value-at-least-32-chars
          FEDERATION_BOOTSTRAP_SECRET=ci-only-federation-secret
          SUPERADMIN_EMAIL=ci-superadmin@smarteam.test
          SUPERADMIN_PASSWORD=ci-only-superadmin-password
          AWS_REGION=us-east-1
          AWS_S3_BUCKET=smarteam-files
          # CI-only: points the SDK at the MinIO container above. Blank everywhere else.
          AWS_S3_ENDPOINT=http://localhost:9000
          AWS_S3_FORCE_PATH_STYLE=true
          AWS_ACCESS_KEY_ID=smarteam
          AWS_SECRET_ACCESS_KEY=smarteam-ci-only
          ENV

      - run: pnpm db:deploy
      - run: pnpm --filter @smarteam/api db:seed
      # `...` includes the workspace packages the API imports; building the app alone
      # leaves @smarteam/contracts without its declarations.
      - run: pnpm build --filter @smarteam/api...

      - name: Start the API
        run: |
          pnpm --filter @smarteam/api start > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/health/ready && break || sleep 2
          done

      # Run every suite even if one fails, so a red build reports all the damage rather than the
      # first symptom.
      - name: Run the verify suites
        run: |
          failed=""
          for suite in auth employees teams attendance leave payroll organization files \
                       holidays employee-detail employee-directory onboarding \
                       payroll-staleness timesheet-approval-cycle concurrency \
                       authorization-boundaries; do
            echo "::group::verify:$suite"
            pnpm "verify:$suite" || failed="$failed $suite"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi

      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/api.log

  # Static analysis of the code itself. `pnpm audit` only knows about published advisories in
  # dependencies; it cannot see an injection or an unsafe comparison written here. CodeQL reads
  # the source, which is the gap that dependency scanning alone always leaves.
  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Scopes the scan to the shipped surface; see the file for what is excluded and why.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # Secrets, in the working tree and in history. A committed credential is not caught by any of
  # the jobs above, and this repository has already had one: the superadmin password was quoted
  # in a security document and reached a commit.
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history, not just the tip. A secret removed in the latest commit is still a
          # secret if it is reachable from an earlier one.
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --no-banner

  # Backup and restore, exercised rather than assumed.
  #
  # docs/chore/TECHSTACK.v1.md requires recoverable payroll data. A backup nobody has restored is
  # a hypothesis, so this takes a real dump of a migrated database and restores it into a separate
  # one, asserting that the migration ledger, row-level security and the data all survive. The
  # WAL/PITR half of the requirement is server configuration and lives in
  # docs/operations/backup-and-recovery.md; what can be verified in CI is verified here.
  backup-restore:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smarteam
          POSTGRES_PASSWORD: smarteam
          POSTGRES_DB: smarteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarteam -d smarteam"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://smarteam:smarteam@localhost:5432/smarteam
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # The client tools must match the server, or pg_dump refuses on a version mismatch.
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-17
      - run: pnpm db:deploy
      # The runner ships an older pg_dump on PATH, and pg_dump refuses to dump a newer server.
      # Point at the client just installed rather than hoping PATH resolution favours it.
      - run: pnpm db:backup
        env:
          PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump
      - run: pnpm db:verify-restore
        env:
          PG_RESTORE_PATH: /usr/lib/postgresql/17/bin/pg_restore

  # The deployable artifact. Building it here is what keeps the Dockerfile honest: without this a
  # change that breaks the production image is only discovered at deploy time.
  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smarteam
          POSTGRES_PASSWORD: smarteam
          POSTGRES_DB: smarteam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smarteam -d smarteam"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Readiness probes the database *and* Redis. Without this the image came up live in two
      # seconds and then `/health/ready` never answered at all: ioredis keeps retrying a refused
      # connection rather than failing, so the check hung instead of reporting redis down.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: smarteam/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The API image serves against a real database
        # Bounded well inside the job budget. The previous version of this step produced no output
        # at all and was killed by the job timeout 21 minutes in, which loses a cancelled step's
        # log and leaves nothing to diagnose. Everything below is time-limited and traced, so a
        # hang fails here with the reason attached instead of eating the job.
        timeout-minutes: 6
        run: |
          set -x
          # `RlsEnforcementGuard` verifies at bootstrap that the runtime role cannot bypass RLS, so
          # the container deliberately refuses to start without a database. Giving it one is what
          # makes this a smoke test of the image rather than of the guard.
          docker image inspect smarteam/api:ci >/dev/null
          # --pull=never: the image was just built and loaded. Without this, a missing image sends
          # docker to Docker Hub for a repository that does not exist, which is a hang rather than
          # an error worth waiting on.
          timeout 60 docker run -d --pull=never --name api-smoke --network host \
            -e NODE_ENV=development \
            -e DATABASE_URL=postgresql://smarteam:smarteam@127.0.0.1:5432/smarteam \
            -e JWT_SECRET=0123456789012345678901234567890123456789 \
            -e FEDERATION_BOOTSTRAP_SECRET=0123456789012345 \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e AWS_S3_BUCKET=smoke \
            smarteam/api:ci
          for i in $(seq 1 45); do
            if ! docker inspect -f '{{.State.Running}}' api-smoke | grep -q true; then
              echo "the container exited before it served"; docker logs api-smoke | tail -50; exit 1
            fi
            live=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:4000/health/live || true)
            if [ "$live" = "200" ]; then
              echo "liveness $live after ${i} attempts"
              # Readiness is polled, not sampled. It fans out to the database and Redis, so it can
              # answer later and more slowly than liveness — reading it once at the moment liveness
              # first turns 200 measured the connection pools warming up, not the image.
              # Bounded so the worst case (90s waiting for liveness, then 15 * 12s here) still
              # lands inside the step's six minutes and fails with a message rather than a kill.
              for j in $(seq 1 15); do
                ready=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:4000/health/ready || true)
                [ "$ready" = "200" ] && { echo "readiness $ready after ${j} attempts"; exit 0; }
                sleep 2
              done
              # Readiness reports on the dependencies it actually reached; with a database and
              # Redis attached it must say so, or the check is not checking anything. The body
              # names which dependency is down, which the status code alone does not.
              echo "readiness should be 200 with a database and redis, got $ready"
              curl -s --max-time 15 http://localhost:4000/health/ready || true
              docker logs api-smoke | tail -50
              exit 1
            fi
            sleep 2
          done
          echo "API image never reported liveness"; docker logs api-smoke | tail -50; exit 1

      - name: Container log on failure
        if: failure()
        run: docker logs api-smoke 2>&1 | tail -100 || true
      - name: Build the web images
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web-org
          push: false
          tags: smarteam/web-org:ci
          cache-from: type=gha
